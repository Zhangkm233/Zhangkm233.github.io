<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="游戏项目详情 - 独立游戏制作人技术作品集">
    <title>游戏项目详情 - 独立游戏制作人技术作品集</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project.css">
</head>
<body>
    <!-- 固定导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">3KkM</a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html#home" class="nav-link">首页</a></li>
                <li><a href="index.html#portfolio" class="nav-link">游戏项目</a></li>
                <li><a href="index.html#about" class="nav-link">关于</a></li>
                <li><a href="index.html#contact" class="nav-link">联系</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 作品详情内容 -->
    <main class="project-detail">
        <!-- 返回按钮 -->
        <div class="container">
            <a href="index.html#portfolio" class="back-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>返回游戏项目</span>
            </a>
        </div>

        <!-- 作品头部 -->
        <section class="project-header">
            <div class="container">
                <div class="project-meta">
                    <div class="project-tags" id="projectTags"></div>
                    <h1 class="project-title" id="projectTitle">加载中...</h1>
                    <p class="project-subtitle" id="projectSubtitle"></p>
                </div>
            </div>
        </section>

        <!-- 作品封面图/视频 -->
        <section class="project-hero">
            <div class="container">
                <div class="hero-media" id="heroMedia">
                    <!-- 视频或图片将在这里动态加载 -->
                </div>
            </div>
        </section>

        <!-- 作品介绍 -->
        <section class="project-content">
            <div class="container">
                <div class="content-wrapper">
                    <div class="project-description" id="projectDescription">
                        <!-- 描述内容将在这里动态加载 -->
                    </div>
                    
                    <div class="project-sidebar">
                        <div class="info-card">
                            <h3>项目信息</h3>
                            <div class="info-item">
                                <span class="info-label">类别</span>
                                <span class="info-value" id="projectCategory"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">时间</span>
                                <span class="info-value" id="projectDate"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">角色</span>
                                <span class="info-value" id="projectRole"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">工具</span>
                                <span class="info-value" id="projectTools"></span>
                            </div>
                        </div>
                        <!-- 项目链接 -->
                        <div class="project-links" id="projectLinks">
                            <!-- GitHub和下载链接将在这里动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 作品图片展示 -->
        <section class="project-gallery" id="projectGallery">
            <div class="container">
                <h2 class="gallery-title">项目展示</h2>
                <div class="gallery-grid" id="galleryGrid">
                    <!-- 图片将在这里动态加载 -->
                </div>
            </div>
        </section>

        <!-- 项目亮点 -->
        <section class="project-highlights" id="projectHighlights">
            <div class="container">
                <!-- 亮点内容将在这里动态加载 -->
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 3KkM. https://github.com/Zhangkm233/Zhangkm233.github.io</p>
            <a href="index.html#home" class="back-to-top" id="backToTop">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </a>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/project.js"></script>
</body>
</html>
